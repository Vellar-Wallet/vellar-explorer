name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck before test so a type error surfaces as itself, not as a confusing test failure.
      - run: npm run typecheck
      # Offline unit tests only (src/**/*.test.ts). scripts/validate-heuristic.ts is deliberately
      # NOT run here: it hits live testnet RPC and is a manual ground-truth tool, not a CI test.
      - run: npm test
      - run: npm run build
